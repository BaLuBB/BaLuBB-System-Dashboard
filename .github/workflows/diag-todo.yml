name: Diag Todo
on:
  push:
    branches: [claude/diag-todo]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Feldnamen und Typen (keine Werte)
        env:
          BALUBB_API_KEY: ${{ secrets.BALUBB_API_KEY }}
        run: |
          H="Authorization: Bearer $BALUBB_API_KEY"; B=https://bot.balubb.de/api/ext/v1
          for ep in health servers system counts overview maintenance; do
            code=$(curl -sS -o r.json -w "%{http_code}" -H "$H" "$B/$ep")
            echo "=== $ep HTTP $code"
            jq -r '[paths(scalars) as $p | ($p | map(if type=="number" then "[]" else . end) | join(".")) + " : " + (getpath($p)|type)] | unique | .[]' r.json
          done
