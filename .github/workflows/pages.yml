name: Status-Seite (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *' # Reserve; zuverlässig startet der Cloudflare-Worker (cloudflare-worker/)

permissions:
  contents: write
  pages: write
  id-token: write

# Laufende Veröffentlichungen werden nie abgebrochen (ein abgebrochener Lauf mitten in der Veröffentlichung kann Pages auf einem alten Stand hängen lassen);
# wartet schon ein Lauf, ersetzt ihn der neueste.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vorab messen, was die Auslieferung gerade hergibt (nur Diagnose, bricht nie ab)
        continue-on-error: true
        env:
          VITE_DATA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/data/
        run: node scripts/check-live.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" dist-pages vorher
      - name: Bauen und Snapshot verschlüsseln
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          BALUBB_API_KEY: ${{ secrets.BALUBB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SNAPSHOT_INTERVAL_MIN: 2
          NAME_FILTER: ${{ vars.NAME_FILTER }}
          VITE_DATA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/data/
        run: npm run build:pages
      # Zweiter Weg für die Daten, unabhängig von GitHub Pages: der verschlüsselte Snapshot und die letzten Intervall-Dateien liegen auf dem Zweig „data“
      # (eine einzige Übergabe, jedes Mal neu geschrieben, die Versionsgeschichte wächst nicht). Die Seite liest zuerst von dort.
      - name: Daten-Zweig aktualisieren
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          work="$(mktemp -d)"
          mkdir -p "$work/s"
          git fetch --depth=1 origin data 2>/dev/null && git archive FETCH_HEAD s 2>/dev/null | tar -x -C "$work" || true
          cp dist-pages/snapshot.enc.json "$work/"
          cp -f dist-pages/s/*.json "$work/s/"
          ls "$work"/s/*.json | sort | head -n -8 | xargs -r rm -f
          cd "$work"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Stand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "Daten-Zweig geschrieben: $(ls s | wc -l) Intervall-Dateien"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      # Die fertige Aktion nimmt als Version den Commit (GITHUB_SHA). Läuft derselbe Commit hunderte Male, bleibt die Auslieferung irgendwann auf einem alten Stand hängen,
      # obwohl jeder Lauf „erfolgreich“ meldet. Darum bekommt jede Veröffentlichung eine eigene, aus Commit und Laufnummer gebildete Version.
      - name: Version dieser Veröffentlichung bilden
        id: version
        run: echo "sha=$(printf '%s-%s-%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Veröffentlichen (eigene Version je Lauf)
        id: own
        continue-on-error: true
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.version.outputs.sha }}
      - name: Veröffentlichen mit dem Commit als Version (nur wenn die eigene Version scheiterte)
        id: deployment
        if: steps.own.outcome != 'success'
        uses: actions/deploy-pages@v4
      - name: Veröffentlichung von außen prüfen (nur Diagnose, bricht nie ab)
        if: always() && (steps.own.outcome == 'success' || steps.deployment.outcome == 'success')
        continue-on-error: true
        env:
          VITE_DATA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/data/
        run: node scripts/check-live.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" dist-pages
