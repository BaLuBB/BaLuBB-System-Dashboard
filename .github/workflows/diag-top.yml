name: Diag Top
on:
  push:
    branches: [claude/diag-top-fields]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Zaehlung ohne Namen
        env:
          BALUBB_API_KEY: ${{ secrets.BALUBB_API_KEY }}
        run: |
          H="Authorization: Bearer $BALUBB_API_KEY"; B=https://bot.balubb.de/api/ext/v1
          curl -sS -H "$H" "$B/servers" -o s.json
          curl -sS -H "$H" "$B/servers/top?n=10&days=90" -o t.json
          echo "servers: gesamt=$(jq '.items|length' s.json) passend=$(jq '[.items[]|select((.name//"")|test("balubb|bot";"i"))|select(.name!="Test Bot 1")]|length' s.json)"
          echo "top: items=$(jq '.items|length' t.json) servers_with_data=$(jq '.servers_with_data' t.json) passend=$(jq '[.items[]|select((.name//"")|test("balubb|bot";"i"))|select(.name!="Test Bot 1")]|length' t.json)"
          echo "top-Namen gleich Server-Namen: $(jq -n --slurpfile s s.json --slurpfile t t.json '[$t[0].items[].name] as $tn | [$s[0].items[].name] as $sn | [$tn[] | select(. as $x | $sn | index($x))] | length')"
          echo "top.id-Beispiel Typ: $(jq -r '.items[0].id|type' t.json); Namenslaenge min/max: $(jq '[.items[].name|length]|min' t.json)/$(jq '[.items[].name|length]|max' t.json)"
