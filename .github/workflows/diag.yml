name: Diagnose API-Formate
on:
  workflow_dispatch:
  push:
    branches: [claude/peaceful-pasteur-opbga3]
    paths: [scripts/diag-api.mjs, .github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strukturen der dokumentierten Endpunkte ausgeben (keine Werte)
        env:
          BALUBB_API_KEY: ${{ secrets.BALUBB_API_KEY }}
        run: node scripts/diag-api.mjs
