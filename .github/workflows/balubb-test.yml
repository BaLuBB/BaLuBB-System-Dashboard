name: BaLuBB Test
on: workflow_dispatch
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Health-Check (ohne Daten im öffentlichen Log)
        env:
          BALUBB_API_KEY: ${{ secrets.BALUBB_API_KEY }}
        run: |
          # Logs öffentlicher Repos sind öffentlich: nur Status und Feldnamen ausgeben, keine Werte
          code=$(curl -sS -o body.json -w "%{http_code}" \
            -H "Authorization: Bearer $BALUBB_API_KEY" \
            https://bot.balubb.de/api/ext/v1/health)
          echo "HTTP $code"
          jq -r 'keys | "Felder: " + join(", ")' body.json
          jq -r '"ok = \(.ok), Server \(.servers.running)/\(.servers.total)"' body.json
          [ "$code" = "200" ]
